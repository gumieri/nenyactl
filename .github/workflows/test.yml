name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual trigger for the network E2E job below.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Run unit tests
        run: go test -v -coverprofile=coverage.out ./internal/... ./cmd/...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Current coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 51" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 51% threshold"
            exit 1
          fi
          echo "✓ Coverage $COVERAGE% meets threshold"

  tui:
    name: TUI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run TUI tests
        run: go test -v ./internal/agents/... ./internal/containers/... -run TestTUI

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build nenyactl
        run: go build -o bin/nenyactl ./cmd/nenyactl/

      - name: Run integration tests
        run: go test -v ./test/integration/...

  e2e:
    name: E2E (real latest nenya release)
    # Network E2E against a live release: nightly and on demand, not on every
    # push (see the Seam E2E workflow). Kept here for manual runs via
    # 'workflow_dispatch' from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Golden-path E2E against the real latest nenya release
        env:
          NENYACTL_E2E: "1"
        run: go test -v ./test/e2e/... -count=1 -timeout 15m

