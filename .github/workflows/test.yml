name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Run unit tests
        run: go test -v -coverprofile=coverage.out ./internal/... ./cmd/...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Current coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 51" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 51% threshold"
            exit 1
          fi
          echo "✓ Coverage $COVERAGE% meets threshold"

  tui:
    name: TUI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run TUI tests
        run: go test -v ./internal/agents/... ./internal/containers/... -run TestTUI

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build nenyactl
        run: go build -o bin/nenyactl ./cmd/nenyactl/

      - name: Run integration tests
        run: go test -v ./test/integration/...

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      NENYACTL_RUNTIME: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build nenyactl
        run: go build -o bin/nenyactl ./cmd/nenyactl/

      - name: Verify Docker is available
        run: |
          docker info --format 'Docker {{.ServerVersion}} ready'
          docker compose version

      - name: Run full workflow
        env:
          NENYACTL_DATA_DIR: ${{ runner.temp }}/nenyactl
        run: |
          set -eo pipefail
          echo "::group::Setup"
          mkdir -p $NENYACTL_DATA_DIR
          echo "::endgroup::"

          echo "::group::Container Setup"
          ./bin/nenyactl containers setup --dir $NENYACTL_DATA_DIR
          cat $NENYACTL_DATA_DIR/compose.yml
          echo "::endgroup::"

          echo "::group::Container Start"
          ./bin/nenyactl containers start --dir $NENYACTL_DATA_DIR
          echo "::endgroup::"

          echo "::group::Health Check"
          timeout 90 sh -c 'until curl -fsS http://localhost:8080/healthz; do sleep 1; done'
          echo "::endgroup::"

          echo "::group::Container Status"
          ./bin/nenyactl containers status --dir $NENYACTL_DATA_DIR
          echo "::endgroup::"

          echo "::group::Container Stop"
          ./bin/nenyactl containers stop --dir $NENYACTL_DATA_DIR
          echo "::endgroup::"

      - name: Cleanup on failure
        if: failure()
        run: |
          docker compose -f ${{ runner.temp }}/nenyactl/compose.yml down 2>/dev/null || true
