name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual trigger for the network E2E job below.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: latest

      - name: Run unit tests
        run: go test -v -coverprofile=coverage.out ./internal/... ./cmd/...

      # No external coverage SaaS: nenya-parity posture. The ratcheted
      # floors below enforce coverage locally; a coverage profile would
      # otherwise egress build/test structure to a third party.
      - name: Check coverage threshold
        # NCTL-50: per-package floors at or below the function-average
        # measured at ratchet time (containers was set ~8pp under its
        # measured 78.2 to leave room), nenya's ratchet pattern — raise the
        # floor when coverage improves, never lower it. Total floor
        # ratcheted from 51 (pre-NCTL-50) to 75 (measured 76.3; 1pp
        # headroom so a single new uncovered function does not turn CI red).
        run: |
          total_floor=75
          containers_floor=70
          paths_floor=85
          config_floor=86
          agents_floor=87

          go tool cover -func=coverage.out > cover-func.txt
          total=$(awk '/^total:/ {gsub(/%/,"",$3); print $3}' cover-func.txt)
          echo "total coverage: ${total}% (floor ${total_floor}%)"
          fail=0
          check() { # check <label> <measured> <floor>
            echo "  $1: $2% (floor $3%)"
            awk -v c="$2" -v f="$3" 'BEGIN {exit !(c+0 >= f+0)}' || fail=1
          }
          # pkg_avg: the floors are FUNCTION-AVERAGES of `go tool cover
          # -func` per package (statement coverage of the average function),
          # not the whole-package statement total.
          module=$(head -1 go.mod | awk '{print $2}')
          pkg_avg() { # pkg_avg <package prefix> — function-average coverage
            awk -v pkg="$module/$1/" \
              '{if (index($1, pkg) == 1) {gsub(/%/,"",$3); s+=$3; n++}} END {if (n) printf "%.1f", s/n; else print "0"}' \
              cover-func.txt
          }
          check total "$total" "$total_floor"
          check internal/containers "$(pkg_avg internal/containers)" "$containers_floor"
          check internal/paths "$(pkg_avg internal/paths)" "$paths_floor"
          check internal/config "$(pkg_avg internal/config)" "$config_floor"
          check internal/agents "$(pkg_avg internal/agents)" "$agents_floor"
          exit "$fail"
  tui:
    name: TUI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run TUI tests
        run: go test -v ./internal/agents/... ./internal/containers/... -run TestTUI

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build nenyactl
        run: go build -o bin/nenyactl ./cmd/nenyactl/

      - name: Run integration tests
        run: go test -v ./test/integration/...

  e2e:
    name: E2E (real latest nenya release)
    # Network E2E against a live release: nightly and on demand, not on every
    # push (see the Seam E2E workflow). Kept here for manual runs via
    # 'workflow_dispatch' from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Golden-path E2E against the real latest nenya release
        env:
          NENYACTL_E2E: "1"
        run: go test -v ./test/e2e/... -count=1 -timeout 15m

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream (moved/deleted
  # tag, rewritten history). Runs as its own job so it cannot be skipped
  # by an early test failure. The extension version is pinned; bump it
  # deliberately (its install adds no uses: refs, so no relock needed).
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Verify actions lockfile
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  # Static security audit of the workflows themselves (injection
  # surfaces, excessive permissions, credential persistence). Runs at
  # the default (regular) persona; any finding fails the job. Version
  # pinned for reproducibility; bump deliberately.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: 1.32.0

