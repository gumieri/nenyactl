name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Deployment-protection gate: the job does not start (no build, no
    # signing, no release upload) until the required reviewer approves
    # the pending deployment on the run page. Even a tampered or
    # redirected workflow cannot publish unattended.
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Cache-free by design: a publishing pipeline must not read or write
      # shared caches (zizmor cache-poisoning audit). Module downloads on
      # a release run cost seconds-to-minutes at this cadence.
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      # cosign must be on PATH for goreleaser's `signs` step to sign
      # checksums.txt into checksums.txt.sigstore.json (keyless, no keys).
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

      - name: Generate SBOM for archives
        uses: anchore/sbom-action@v0.24.3
        with:
          path: dist/
          format: spdx-json
          output-file: nenyactl-${{ github.ref_name }}-spdx.json

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Env indirection instead of template expansion: a tag name is
          # attacker-influenced text and must never be interpolated into
          # the run script itself (zizmor template-injection audit).
          VERSION: ${{ github.ref_name }}
        run: |
          gh release upload "$VERSION" \
            "nenyactl-${VERSION}-spdx.json" \
            --clobber
